name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://pulsofm:pulsofm@localhost:5432/pulsofm_test
      JWT_SECRET: ci-only-secret-value-1234567890
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsofm
          POSTGRES_PASSWORD: pulsofm
          POSTGRES_DB: pulsofm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsofm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm --filter @pulsofm/api exec prisma generate

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas end-to-end en móvil
        env:
          E2E_DATABASE_URL: postgresql://pulsofm:pulsofm@localhost:5432/pulsofm_test
        run: pnpm exec playwright test -c e2e/playwright.config.mjs

      - name: Subir informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
