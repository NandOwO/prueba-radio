server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Tiempo real (Socket.IO) y API: se reenvían al servicio "api".
  location ~ ^/(auth|tracks|requests|queue|player|library|staff|admin|integrations|health)(/|\?|$) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Los recursos con hash se cachean; el shell (index.html y sw.js) siempre se revalida.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rutas de la app: cualquier otra ruta devuelve la SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
